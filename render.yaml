databases:
  - name: sweet-market-db
    plan: free

services:
  - type: web
    name: sweet-market
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sweet-market-db
          property: connectionString
