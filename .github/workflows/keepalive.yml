name: keep-alive

# Pings the game every 10 minutes so the free Render instance does not sleep,
# and wakes it up again after a deploy or restart.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      GAME_URL: https://sweet-market.onrender.com   # <<< change to your Render address (no trailing slash)
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 "$GAME_URL/api/health"
